services:
  db:
    image: postgres:15
    container_name: tecnohidalgo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - tecnohidalgo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

  web:
    image: odoo:19.0
    container_name: tecnohidalgo-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - tecnohidalgo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

volumes:
  tecnohidalgo-db-data:
  tecnohidalgo-web-data:
